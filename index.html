<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TycheMetrics | Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Top App Bar -->
  <header class="glass-panel sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500 flex items-center justify-center font-bold text-amber-400">T</div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-tight">TycheMetrics</h1>
        <p class="text-[10px] text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Terminal Aktif
        </p>
      </div>
    </div>
    <div id="vipBadge" class="text-[11px] px-2.5 py-1 rounded-full font-semibold border border-amber-500/40 text-amber-400 bg-amber-500/10 cursor-pointer" onclick="openVipModal()">
      VIP: ALPHA2026
    </div>
  </header>

  <!-- Pair Selector Tabs -->
  <div class="px-4 mt-3">
    <div class="grid grid-cols-3 gap-2 p-1 bg-gray-900 rounded-xl border border-gray-800">
      <button onclick="switchPair('XAUUSD', 'FX_IDC:XAUUSD')" id="tab-XAUUSD" class="pair-tab py-2 text-xs font-bold rounded-lg text-center bg-amber-500 text-gray-950">
        XAU/USD
      </button>
      <button onclick="switchPair('EURUSD', 'FX:EURUSD')" id="tab-EURUSD" class="pair-tab py-2 text-xs font-bold rounded-lg text-center text-gray-400 hover:text-white">
        EUR/USD
      </button>
      <button onclick="switchPair('GBPUSD', 'FX:GBPUSD')" id="tab-GBPUSD" class="pair-tab py-2 text-xs font-bold rounded-lg text-center text-gray-400 hover:text-white">
        GBP/USD
      </button>
    </div>
  </div>

  <!-- Live TradingView Chart Widget -->
  <div class="px-4 mt-3">
    <div class="glass-panel rounded-2xl overflow-hidden p-1 shadow-lg">
      <div id="tradingview_chart" style="height: 340px; width: 100%;"></div>
    </div>
  </div>

  <!-- Active Signal Execution Card -->
  <div class="px-4 mt-4">
    <div class="glass-panel rounded-2xl p-4 border border-amber-500/30">
      <div class="flex items-center justify-between pb-3 border-b border-gray-800">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-wider text-amber-400">Sinyal Radar Aktif</span>
          <h2 id="activePairTitle" class="text-lg font-black text-white">XAU/USD (Gold)</h2>
        </div>
        <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          REKOMENDASI: BUY
        </span>
      </div>

      <div class="grid grid-cols-3 gap-2 my-3 text-center">
        <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
          <p class="text-[10px] text-gray-400">Entry Zone</p>
          <p id="valEntry" class="text-xs font-bold text-white mt-0.5">\$2,652.50</p>
        </div>
        <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
          <p class="text-[10px] text-rose-400 font-semibold">Stop Loss (SL)</p>
          <p id="valSL" class="text-xs font-bold text-rose-400 mt-0.5">\$2,648.50</p>
        </div>
        <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
          <p class="text-[10px] text-emerald-400 font-semibold">Target (TP)</p>
          <p id="valTP" class="text-xs font-bold text-emerald-400 mt-0.5">\$2,662.50</p>
        </div>
      </div>

      <button onclick="copyTradeParams()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 active:scale-98 text-xs font-bold text-white rounded-xl flex items-center justify-center gap-2 border border-gray-700">
        <i class="fa-regular fa-copy"></i> Salin Parameter Eksekusi (SL/TP)
      </button>
    </div>
  </div>

  <!-- Risk & Lot Calculator -->
  <div class="px-4 mt-4">
    <div class="glass-panel rounded-2xl p-4">
      <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-calculator text-amber-400"></i> Kalkulator Lot Cepat
      </h3>
      
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="text-[10px] text-gray-400">Saldo Modal (\$)</label>
          <input id="accBalance" type="number" value="10" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500" oninput="calcLot()">
        </div>
        <div>
          <label class="text-[10px] text-gray-400">Tipe Akun</label>
          <select id="accType" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500" onchange="calcLot()">
            <option value="cent">Cent Account (Aman \$10)</option>
            <option value="standard">Standard Account</option>
          </select>
        </div>
      </div>

      <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 flex justify-between items-center">
        <div>
          <p class="text-[10px] text-amber-300">Rekomendasi Ukuran Lot</p>
          <p class="text-[10px] text-gray-400">Risiko Maks: 1-2% Modal</p>
        </div>
        <p id="lotResult" class="text-base font-extrabold text-amber-400">0.05 Lot Cent</p>
      </div>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    let activeSymbol = "FX_IDC:XAUUSD";

    function renderChart(symbol) {
      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "15",
        "timezone": "Asia/Jakarta",
        "theme": "dark",
        "style": "1",
        "locale": "id",
        "toolbar_bg": "#111827",
        "enable_publishing": false,
        "hide_side_toolbar": true,
        "allow_symbol_change": false,
        "container_id": "tradingview_chart"
      });
    }

    renderChart(activeSymbol);

    const pairData = {
      'XAUUSD': { name: 'XAU/USD (Gold)', tv: 'FX_IDC:XAUUSD', entry: '\$2,652.50', sl: '\$2,648.50', tp: '\$2,662.50' },
      'EURUSD': { name: 'EUR/USD', tv: 'FX:EURUSD', entry: '1.08200', sl: '1.08000', tp: '1.08600' },
      'GBPUSD': { name: 'GBP/USD', tv: 'FX:GBPUSD', entry: '1.29800', sl: '1.29550', tp: '1.30300' }
    };

    function switchPair(pairKey, tvSymbol) {
      document.querySelectorAll('.pair-tab').forEach(b => {
        b.className = "pair-tab py-2 text-xs font-bold rounded-lg text-center text-gray-400 hover:text-white";
      });
      document.getElementById('tab-' + pairKey).className = "pair-tab py-2 text-xs font-bold rounded-lg text-center bg-amber-500 text-gray-950";
      
      const p = pairData[pairKey];
      document.getElementById('activePairTitle').innerText = p.name;
      document.getElementById('valEntry').innerText = p.entry;
      document.getElementById('valSL').innerText = p.sl;
      document.getElementById('valTP').innerText = p.tp;
      renderChart(p.tv);
    }

    function calcLot() {
      const balance = parseFloat(document.getElementById('accBalance').value) || 0;
      const type = document.getElementById('accType').value;
      const res = document.getElementById('lotResult');

      if (type === 'cent') {
        const lot = (balance * 0.005).toFixed(2);
        res.innerText = `${lot} Lot Cent`;
      } else {
        const lot = Math.max(0.01, (balance * 0.00005)).toFixed(2);
        res.innerText = `${lot} Lot Standard`;
      }
    }

    function copyTradeParams() {
      const p = document.getElementById('activePairTitle').innerText;
      const sl = document.getElementById('valSL').innerText;
      const tp = document.getElementById('valTP').innerText;
      const text = `TycheMetrics Execution:\nPair: ${p}\nSL: ${sl}\nTP: ${tp}`;
      navigator.clipboard.writeText(text);
      alert('Parameter eksekusi berhasil disalin ke clipboard!');
    }

    function openVipModal() {
      alert("Akses VIP Aktif: ALPHA2026. Seluruh fitur Pro terbuka permanen.");
    }
  </script>
</body>
</html>
