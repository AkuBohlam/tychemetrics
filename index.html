<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TycheMetrics | Institutional Terminal</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --gold-accent: #D4AF37;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --buy-color: #00E676;
            --sell-color: #FF1744;
            --radar-color: #FFA000;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
        }

        header {
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            color: var(--gold-accent);
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sys-status {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .section-title {
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border-left: 3px solid var(--gold-accent);
            padding-left: 10px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .data-label {
            color: var(--text-muted);
        }

        .data-value {
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .val-buy { color: var(--buy-color); }
        .val-sell { color: var(--sell-color); }
        .val-radar { color: var(--radar-color); }
        .val-gold { color: var(--gold-accent); }

        .terminal-logic {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #444;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--gold-accent);
        }

        #radar-container, #signal-container {
            min-height: 100px;
        }

        .empty-state {
            color: #555;
            font-style: italic;
            font-family: var(--font-mono);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>TYCHEMETRICS</h1>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">PRECISION SIGNALS. MEASURED RISK.</div>
        </div>
        <div class="sys-status" id="last-update">SYS_UPDATE: FETCHING...</div>
    </header>

    <div class="grid-container">
        <!-- RADAR SECTION -->
        <div>
            <div class="section-title">Institutional Radar (Phase 1)</div>
            <div id="radar-container">
                <div class="empty-state">No active radar. Scanning zones...</div>
            </div>
        </div>

        <!-- EXECUTION SECTION -->
        <div>
            <div class="section-title">Execution Terminal (Phase 2)</div>
            <div id="signal-container">
                <div class="empty-state">No active execution signals...</div>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil data dari file signals.json
        async function fetchTerminalData() {
            try {
                // Menambahkan timestamp cache-busting agar selalu dapat data terbaru
                const response = await fetch('signals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Data tidak ditemukan");
                
                const data = await response.json();
                renderTerminal(data);
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                document.getElementById('last-update').innerText = "SYS_UPDATE: ERROR_FETCHING_DATA";
            }
        }

        function renderTerminal(data) {
            // Update Waktu
            document.getElementById('last-update').innerText = "SYS_UPDATE: " + (data.updated_at || "UNKNOWN");

            const radarContainer = document.getElementById('radar-container');
            const signalContainer = document.getElementById('signal-container');
            
            radarContainer.innerHTML = '';
            signalContainer.innerHTML = '';

            let radarCount = 0;
            let signalCount = 0;

            // Render Eksekusi (Phase 2)
            if (data.active_signals && data.active_signals.length > 0) {
                // Balik urutan agar yang terbaru di atas
                data.active_signals.slice().reverse().forEach(sig => {
                    const typeClass = sig.type.includes("BUY") ? "val-buy" : "val-sell";
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="data-row">
                            <span class="data-label">INSTRUMENT:</span>
                            <span class="data-value">${sig.pair}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">ACTION:</span>
                            <span class="data-value ${typeClass}">${sig.type}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">ENTRY:</span>
                            <span class="data-value">${sig.entry}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">SL (ATR PROTECTED):</span>
                            <span class="data-value val-sell">${sig.sl}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">TP (STRUCTURAL):</span>
                            <span class="data-value val-buy">${sig.tp}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">RISK/REWARD:</span>
                            <span class="data-value val-gold">${sig.rr}</span>
                        </div>
                        <div class="terminal-logic">
                            > LOGIC: ${sig.strategy} | ZONE_TEST: TRUE | VOLATILITY: FILTERED
                        </div>
                    `;
                    signalContainer.appendChild(card);
                    signalCount++;
                });
            }

            // Render Radar (Phase 1) dari radar_locks
            if (data.radar_locks) {
                for (const [key, status] of Object.entries(data.radar_locks)) {
                    if (status === "RADAR") {
                        const instrument = key.replace("CORE_", "");
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="data-row">
                                <span class="data-label">TARGET:</span>
                                <span class="data-value">${instrument}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">STATUS:</span>
                                <span class="data-value val-radar">ZONE ENTERED - AWAITING TRIGGER</span>
                            </div>
                            <div class="terminal-logic">
                                > ENGINE: PENDING M5 ENGULFING CONFIRMATION
                            </div>
                        `;
                        radarContainer.appendChild(card);
                        radarCount++;
                    }
                }
            }

            if (radarCount === 0) radarContainer.innerHTML = '<div class="empty-state">No active radar. Scanning zones...</div>';
            if (signalCount === 0) signalContainer.innerHTML = '<div class="empty-state">No active execution signals...</div>';
        }

        // Auto-refresh setiap 30 detik
        fetchTerminalData();
        setInterval(fetchTerminalData, 30000);
    </script>
</body>
</html>
